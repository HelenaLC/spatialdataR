name: Continuous Benchmarks (Comment)

concurrency:
  # head_ref is empty for workflow_run events, so group by the Receive run.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["Continuous Benchmarks (Receive)"]
    types:
      - completed

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  upload:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - uses: lorenzwalthert/touchstone/actions/comment@7e6072a25d1f8d72649188bc711113039ef94b75
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
